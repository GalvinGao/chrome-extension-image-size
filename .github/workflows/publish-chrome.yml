name: Publish to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'status: read only; upload: draft; stage: review then hold; publish: review then release'
        type: choice
        options: [status, upload, stage, publish]
        default: status
        required: true

permissions:
  contents: read

concurrency:
  group: chrome-webstore-${{ vars.CWS_EXTENSION_ID || github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-webstore
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate target configuration
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          test -n "$CWS_PUBLISHER_ID" || { echo 'Set CWS_PUBLISHER_ID before running this workflow.'; exit 1; }
          test -n "$CWS_EXTENSION_ID" || { echo 'Create the store item and set CWS_EXTENSION_ID first.'; exit 1; }
      - if: inputs.mode != 'status'
        run: npm run check && npm test && npm run package
      - name: Authenticate with Google (optional keyless setup)
        id: google-auth
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Run Chrome Web Store operation
        env:
          CWS_MODE: ${{ inputs.mode }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: node scripts/chrome-webstore.mjs "$CWS_MODE"
